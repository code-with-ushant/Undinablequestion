<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undinablequestion</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
}

.container{
    text-align:center;
}

h2{
    font-size:3rem;
    color:white;
    margin-bottom:30px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.2);
}

.buttons{
    position:relative;
    width:400px;
    height:150px;
    margin:auto;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:1.2rem;
    cursor:pointer;
    transition:0.2s;
}

#yesBtn{
    background:#4CAF50;
    color:white;
    margin-right:20px;
}

#yesBtn:hover{
    transform:scale(1.1);
}

#noBtn{
    position:absolute;
    background:#ff4444;
    color:white;
    left:220px;
    top:0;
}

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    animation:pop .5s ease;
}

.popup img{
    width:250px;
    border-radius:15px;
    margin:15px 0;
}

.popup h2{
    color:#ff4081;
    margin-bottom:10px;
}

.close{
    background:#ff4081;
    color:white;
    margin-top:15px;
}

@keyframes pop{
    from{
        transform:scale(0);
    }
    to{
        transform:scale(1);
    }
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-10px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

.message{
    margin-top:20px;
    color:white;
    font-size:1.2rem;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">
    <h2>❤️ Are you sending Me hot pic? ❤️</h2>

    <div class="buttons">
        <button id="yesBtn">YES baby 😍</button>
        <button id="noBtn">NO😒</button>
    </div>

    <div class="message" id="message"></div>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        <h2>I KNEW IT! ❤️🥳</h2>

        <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

        <p>
            You finally admitted it! 😆💕
        </p>

        <button class="close" onclick="closePopup()">
            Aww ❤️
        </button>
    </div>
</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const popup = document.getElementById("popup");
const message = document.getElementById("message");

const funnyTexts = [
    "Nice try 😏",
    "You missed 😂",
    "No isn't allowed 🤣",
    "Try harder 😜",
    "The button has escaped 🏃",
    "You can't reject me 😭",
    "System Error: NO disabled ❌",
    "Mission Failed Successfully 😂"
];

function moveButton(){

    const maxX = window.innerWidth - 120;
    const maxY = window.innerHeight - 80;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";

    message.textContent =
        funnyTexts[Math.floor(Math.random()*funnyTexts.length)];
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);
noBtn.addEventListener("click", moveButton);

yesBtn.addEventListener("click", () => {
    popup.style.display = "flex";
    createConfetti();
});

function closePopup(){
    popup.style.display = "none";
}

function createConfetti(){

    const colors = [
        "#ff4081",
        "#ffeb3b",
        "#00e676",
        "#00b0ff",
        "#ff5722"
    ];

    for(let i=0;i<250;i++){

        const confetti =
            document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left =
            Math.random()*100 + "vw";

        confetti.style.background =
            colors[Math.floor(Math.random()*colors.length)];

        confetti.style.animationDuration =
            (Math.random()*3+2)+"s";

        document.body.appendChild(confetti);

        setTimeout(()=>{
            confetti.remove();
        },5000);
    }
}

</script>

</body>
</html>
